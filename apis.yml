aid: thrift
name: Apache Thrift
description: >-
  Apache Thrift is a cross-language RPC framework originally developed at
  Facebook for scalable cross-language services development. It provides a
  lightweight, language-independent software stack for point-to-point RPC
  implementation with clean abstractions for data transport, serialization,
  and application-level processing. The framework includes an Interface
  Definition Language (IDL) compiler that generates client and server code
  for 28+ programming languages including C++, Java, Python, Go, Ruby, PHP,
  Node.js, C#, and many others, enabling seamless cross-language service
  communication.
