apis:
  - aid: thrift:thrift
    name: Apache Thrift
    description: >-
      Apache Thrift is a lightweight, language-independent software stack for
      point-to-point RPC implementation. It provides abstractions for data
      transport, serialization, and application-level processing with a code
      generation engine that produces client and server code for 28+
      programming languages from a simple Interface Definition Language (IDL)
      definition. Thrift supports backward and forward compatibility through
      non-atomic version changes and is widely used for building high-performance
      cross-language microservices.
